<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration | Student Hub</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">🎓</span><span>Student Hub</span></a><div class="nav-actions"><button id="themeBtn" class="icon-btn" aria-label="Toggle theme">🌙</button><a class="btn btn-secondary" href="login.html">Login</a></div></div></header><main class="auth-wrap"><form id="registerForm" class="auth-card card" novalidate><span class="eyebrow">New student</span><h1>Create your account</h1><p class="section-sub">All fields are validated with JavaScript and regular expressions.</p><div class="form-grid two"><div class="field"><label for="name">Full Name</label><input id="name" name="name" type="text" autocomplete="name" required pattern="[A-Za-z ]{2,40}"><div id="err-name" class="error"></div></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><div id="err-email" class="error"></div></div><div class="field"><label for="mobile">Mobile</label><input id="mobile" name="mobile" type="tel" inputmode="numeric" maxlength="10" required><div id="err-mobile" class="error"></div></div><div class="field"><label for="course">Course</label><select id="course" required><option value="">Select course</option><option>B.Tech Computer Engineering</option><option>B.Tech IT</option><option>BCA</option><option>MCA</option></select><div id="err-course" class="error"></div></div><div class="field"><label for="year">Year</label><select id="year" required><option value="">Select year</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select><div id="err-year" class="error"></div></div><div class="field"><label for="password">Password</label><input id="password" type="password" minlength="8" maxlength="20" autocomplete="new-password" required><div class="strength" aria-label="Password strength"><i id="strengthBar"></i></div><span class="hint">Use uppercase, lowercase, number and symbol.</span><div id="err-password" class="error"></div></div><div class="field"><label for="confirmPassword">Confirm Password</label><input id="confirmPassword" type="password" autocomplete="new-password" required><div id="err-confirmPassword" class="error"></div></div></div><div class="field"><label>Gender</label><div class="actions"><label class="check"><input type="radio" name="gender" value="Female"> Female</label><label class="check"><input type="radio" name="gender" value="Male"> Male</label><label class="check"><input type="radio" name="gender" value="Other"> Other</label></div><div id="err-gender" class="error"></div></div><label class="check"><input id="terms" type="checkbox"> <span>I accept the Student Hub terms and privacy notice.</span></label><div id="err-terms" class="error"></div><div class="actions"><button class="btn btn-primary" type="submit">Create Account</button><a class="btn btn-secondary" href="login.html">Already registered?</a></div></form></main><div id="toast" class="toast" role="status"></div><script src="app.js"></script></body></html>
