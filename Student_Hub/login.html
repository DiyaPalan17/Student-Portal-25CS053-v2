<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Student Hub</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">🎓</span><span>Student Hub</span></a><div class="nav-actions"><button id="themeBtn" class="icon-btn" aria-label="Toggle theme">🌙</button><a class="btn btn-secondary" href="registration.html">Register</a></div></div></header><main class="auth-wrap"><form id="loginForm" class="auth-card card" novalidate><span class="eyebrow">Welcome back</span><h1>Login to Student Hub</h1><p class="section-sub">Use your student credentials to open the dashboard.</p><div class="form-grid"><div class="field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="email" required><div id="loginEmailErr" class="error"></div></div><div class="field"><label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required><div id="loginPassErr" class="error"></div></div><button class="btn btn-primary" type="submit">Login →</button><a class="btn btn-secondary" href="index.html">← Back to information page</a></div></form></main><div id="toast" class="toast" role="status"></div><script src="app.js"></script></body></html>
